<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#000000" />
  <!-- Isometric Deployment Prism (Top Facet - Yellow #E7BA05) -->
  <polygon points="16,5 26,11 16,17 6,11" fill="#E7BA05" stroke="#000000" stroke-width="1" stroke-linejoin="round" />
  <!-- Right Facet - Butter #F6E3B8 -->
  <polygon points="16,17 26,11 26,23 16,29" fill="#F6E3B8" stroke="#000000" stroke-width="1" stroke-linejoin="round" />
  <!-- Left Facet - Leaf #6B9E5A -->
  <polygon points="6,11 16,17 16,29 6,23" fill="#6B9E5A" stroke="#000000" stroke-width="1" stroke-linejoin="round" />
  <!-- Central Telemetry Node -->
  <circle cx="16" cy="17" r="1.5" fill="#000000" />
  <circle cx="16" cy="5" r="1" fill="#E7BA05" />
</svg>
